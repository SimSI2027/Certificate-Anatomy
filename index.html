<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1b1e22" />
    <meta name="description" content="Take a real, synthetic X.509 certificate and its PKCS #10 request apart, field by field, and follow a manual issuance from CSR to verified certificate." />
    <title>Certificate Anatomy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='24' height='16' rx='3' fill='%2330363e' stroke='%235cbfa8' stroke-width='2'/%3E%3Crect x='4' y='24' width='24' height='2' fill='%23e2a64c'/%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip-link" href="#main-stage">Skip to the artifact</a>
    <h1 class="sr-only">Certificate Anatomy: a CSR and the certificate issued from it</h1>
    <div id="app">
      <header class="topbar"></header>
      <main class="stage" id="main-stage" tabindex="-1" aria-label="Artifact stage">
        <div class="camera">
          <div class="world">
            <svg class="links" aria-hidden="true" width="100%" height="100%"></svg>
          </div>
        </div>
      </main>
      <div class="opening" hidden></div>
      <div class="legend" role="group" aria-label="Field sources" hidden></div>
      <aside class="inspector" aria-label="Field explanation" hidden></aside>
      <footer class="bottombar"></footer>
      <div class="overlay" hidden></div>
      <div id="live" class="sr-only" aria-live="polite"></div>
      <noscript>Certificate Anatomy needs JavaScript to take the artifacts apart.</noscript>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
